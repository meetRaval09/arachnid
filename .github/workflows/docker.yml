# Builds the Arachnid Docker image, tests it, and publishes it as ghcr.io/<owner>/arachnid
# Copy this file to .github/workflows/docker.yml
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "docker/**", "requirements.txt", "github/docker.yml", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build a copy to test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arachnid:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test inside the image
        run: |
          set -e
          docker run --rm arachnid:test version
          docker run --rm arachnid:test selftest          # repair, safety gate, alarms, approvals, undo
          docker run --rm arachnid:test accuracy          # 15 planted problems found, decoys quiet
          # a project shared from this computer, as a normal (not root) user - files must stay the user's
          mkdir -p /tmp/demo && printf '# Demo\n\nWe recieve the data.\n' > /tmp/demo/README.md
          docker run --rm --user "$(id -u):$(id -g)" -v /tmp/demo:/project -v demo-reports:/app/reports -v demo-backups:/app/backups arachnid:test fix || true
          grep -q "We receive the data." /tmp/demo/README.md
          test "$(stat -c %u /tmp/demo/README.md)" = "$(id -u)"
          docker run --rm --user "$(id -u):$(id -g)" -v /tmp/demo:/project -v demo-reports:/app/reports -v demo-backups:/app/backups arachnid:test undo
          grep -q "We recieve the data." /tmp/demo/README.md
          echo "All image tests passed."

      - name: Image names
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/arachnid
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Sign in to GitHub's image store
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (Windows/Intel and Apple-silicon Macs)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
