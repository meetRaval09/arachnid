# Arachnid tests itself on every push and pull request.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the optional pieces
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          python -m playwright install --with-deps chromium
      - name: Self-test (fix, safety gate, alarms, approvals, undo)
        run: python arachnid.py selftest
      - name: Accuracy test (30 planted problems, 20 clean look-alikes)
        run: python qa_accuracy.py
      - name: Brutal HTML test (38 deeply hidden bugs, clean twin must stay silent)
        run: python qa_html_brutal.py
      - name: Brutal CSS test (30 deeply hidden CSS bugs, clean twin must stay silent)
        run: python qa_css_brutal.py
      - name: Brutal slim test (shorter code, same product - traps untouched, wrong AI answers stopped)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/esb" esbuild@0.25.0
          ARACHNID_ESBUILD_DIR="$RUNNER_TEMP/esb" python qa_slim_brutal.py
      - name: Known security holes (live check against the OSV database)
        run: |
          mkdir -p /tmp/vuln
          printf '{"name":"t","dependencies":{"lodash":"4.17.15"}}' > /tmp/vuln/package.json
          printf 'requests==2.19.1\nflask==3.0.3\n' > /tmp/vuln/requirements.txt
          python vulncheck.py /tmp/vuln | tee /tmp/vuln.txt
          grep -q "lodash 4.17.15 has" /tmp/vuln.txt
          grep -q "requests 2.19.1 has" /tmp/vuln.txt
          grep -q "update lodash to" /tmp/vuln.txt
      - name: Stress test (15 kinds of projects)
        run: python qa_stress.py
