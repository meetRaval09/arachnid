# Arachnid tests itself on every push and pull request.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the optional pieces
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          python -m playwright install --with-deps chromium
      - name: Self-test (fix, safety gate, alarms, approvals, undo)
        run: python arachnid.py selftest
      - name: Accuracy test (20 planted problems, 13 clean look-alikes)
        run: python qa_accuracy.py
      - name: Stress test (15 kinds of projects)
        run: python qa_stress.py
